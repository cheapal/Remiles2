name: Remiles
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+0

environment:
  sdk: '>=3.8.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  font_awesome_flutter: ^10.9.0
  flutter_svg: ^2.2.0
  webview_flutter: ^4.13.0
  
  # Firebase dependencies
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.2.10
  firebase_analytics: ^11.6.0
  firebase_crashlytics: ^4.3.10
  cloud_functions: ^5.1.2
  
  # State Management
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  
  # Google Sign-In
  google_sign_in: ^6.2.1
  
  # Image Picker
  image_picker: ^1.0.7
  
  # Photo Viewer
  photo_view: ^0.15.0
  
  # Printing
  printing: ^5.13.2
  pdf: ^3.11.1
  
  # Sharing
  share_plus: ^10.1.2
  
  # Speech to Text
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  
  # Stripe Payment
  flutter_stripe: ^11.1.0
  http: ^1.2.0
  
  # Date Formatting
  intl: ^0.19.0
  
  # Date Time Picker
  flutter_datetime_picker_plus: ^2.1.0
  
  # Google Maps
  google_maps_flutter: ^2.5.0
  geocoding: ^2.1.1
  google_polyline_algorithm: ^3.1.0
  geolocator: ^13.0.1
  
  # URL Launcher
  url_launcher: ^6.2.5
  
  # Signature Pad
  signature: ^5.4.0
  
  # App Info
  package_info_plus: ^8.1.1
  
  # Local Notifications
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/monogram.png
    - assets/remiles.png
    - assets/leather.png
    - assets/remileswithtagline.svg
    - assets/white_rectangle.png
    - assets/leather_rectangle.png
    - assets/carrier_icon.png
    - assets/shipper_icon.png
    - assets/google.png
    - assets/apple.png
    - assets/login_button.png
    - assets/leather_up.png
    - assets/user.png
    - assets/map.png
    - assets/flag.png
    - assets/phone.png
    - assets/email.png
    - assets/password.png
    - assets/signup_button.png
    - assets/canada_flag.png
    - assets/other_screen_background.png
    - assets/welcome_wave.png
    - assets/welcome_button.png
    - assets/welcometext.png
    - assets/remileswithtag.png
    - assets/split_background.png
    - assets/top_leather.png
    - assets/profile_icon.png
    - assets/green_trolly.png
    - assets/orange_tick.png
    - assets/yellow_truck.png
    - assets/miley_icon.png
    - assets/nav_leather.png
    - assets/home_icon.png
    - assets/trolly_icon.png
    - assets/marketplace.png
    - assets/user_icon.png
    - assets/more_icon.png
    - assets/top_leather_2.png
    - assets/upload_icon.png
    - assets/academy_icon.png
    - assets/support_icon.png
    - assets/messages_icon.png
    - assets/notifications_icon.png
    - assets/remileswhite.png
    - assets/yellow_trolly.png
