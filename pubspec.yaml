  fonts:
    - family: RobotoFlex
      fonts:
        # Correct path as per your file structure.
        - asset: assets/Roboto.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/remiles.png"
  min_sdk_android: 21
  remove_alpha_ios: true
